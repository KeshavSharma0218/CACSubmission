services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safewalk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safewalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safewalk}
      POSTGRES_DB: ${POSTGRES_DB:-safewalk}
    ports:
      - "5432:5432"
    volumes:
      - safewalk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safewalk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safewalk-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL host to point at the compose service name
      # rather than localhost, since the two containers share a Docker network.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-safewalk}:${POSTGRES_PASSWORD:-safewalk}@db:5432/${POSTGRES_DB:-safewalk}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app # live-reload friendly for local dev; remove in a prod compose file
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  safewalk_pgdata:
