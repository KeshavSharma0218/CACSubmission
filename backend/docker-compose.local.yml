# Local development Docker Compose with Postgres + PostGIS
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safewalk-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: safewalk
      POSTGRES_PASSWORD: safewalk
      POSTGRES_DB: safewalk
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflicts
    volumes:
      - safewalk_pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safewalk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safewalk-api-local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Override DATABASE_URL to use container name 'db' on internal port 5432
      DATABASE_URL: postgresql+asyncpg://safewalk:safewalk@db:5432/safewalk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # live reload for development

volumes:
  safewalk_pgdata_local:
